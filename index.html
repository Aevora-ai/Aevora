<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevora | Premium Marketplace</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .hidden { display: none; }
        .job-card:hover { border-color: #3b82f6; transform: translateY(-4px); transition: all 0.3s ease; }
    </style>
</head>
<body>

    <nav class="glass sticky top-0 z-50 px-8 py-4 flex justify-between items-center border-b border-white/5">
        <h1 class="text-2xl font-black tracking-tighter bg-gradient-to-r from-blue-400 to-cyan-300 bg-clip-text text-transparent">AEVORA</h1>
        <div id="user-info" class="hidden flex items-center gap-6">
            <div class="text-right">
                <p id="balance" class="text-emerald-400 font-mono text-sm font-bold">₹0</p>
                <button onclick="topUp()" class="text-[10px] text-blue-400 hover:underline">+ Deposit</button>
            </div>
            <img id="user-pic" class="w-9 h-9 rounded-full ring-2 ring-blue-500/20" src="">
            <button onclick="logout()" class="text-xs text-slate-500 hover:text-white">Logout</button>
        </div>
        <button id="login-btn" onclick="login()" class="bg-blue-600 px-6 py-2 rounded-xl font-bold">Connect</button>
    </nav>

    <main class="max-w-6xl mx-auto p-8 pb-32">
        <div class="mb-10 relative">
            <input id="search" oninput="searchJobs()" placeholder="Search services..." 
                class="w-full bg-white/5 border border-white/10 p-4 pl-6 rounded-2xl outline-none focus:border-blue-500 transition-all text-white">
        </div>

        <div id="admin-panel" class="hidden mb-8 p-6 rounded-2xl bg-red-500/5 border border-red-500/20">
            <h2 class="text-red-400 font-bold text-xs uppercase tracking-widest">Admin Command Center</h2>
        </div>

        <header class="mb-12 flex justify-between items-end">
            <h2 class="text-5xl font-extrabold tracking-tight">Marketplace</h2>
            <button onclick="document.getElementById('post-modal').classList.remove('hidden')" class="bg-white text-black px-8 py-4 rounded-2xl font-black shadow-xl">POST JOB</button>
        </header>

        <div id="job-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 text-center py-10 opacity-50 italic">
            Fetching marketplace data...
        </div>
    </main>

    <div class="fixed bottom-6 right-6 w-80 glass rounded-3xl overflow-hidden shadow-2xl border border-white/10 z-[60]">
        <div class="bg-blue-600/20 p-4 border-b border-white/5 font-bold text-xs uppercase tracking-widest">Global Chat</div>
        <div id="chat-messages" class="h-56 overflow-y-auto p-4 text-xs space-y-2 flex flex-col bg-black/20"></div>
        <div class="p-3 bg-slate-900/50 flex gap-2 border-t border-white/5">
            <input id="chat-input" placeholder="Type a message..." class="flex-1 bg-white/5 border border-white/10 p-2 rounded-xl text-xs outline-none focus:border-blue-500">
            <button onclick="sendMessage()" class="bg-blue-600 px-4 py-2 rounded-xl text-xs font-bold hover:bg-blue-500 transition">Send</button>
        </div>
    </div>

    <div id="post-modal" class="hidden fixed inset-0 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-6 z-[100]">
        <div class="glass p-10 rounded-[2rem] w-full max-w-lg border border-white/10">
            <h3 class="text-3xl font-bold mb-6 italic text-blue-400">New Listing</h3>
            <input id="job-title" type="text" placeholder="Job Title" class="w-full bg-white/5 p-4 rounded-2xl mb-4 outline-none border border-white/10 focus:border-blue-500">
            <input id="job-price" type="number" placeholder="Budget (₹)" class="w-full bg-white/5 p-4 rounded-2xl mb-8 outline-none border border-white/10">
            <div class="flex gap-4">
                <button onclick="postJob()" class="flex-1 bg-blue-600 p-5 rounded-2xl font-bold">Post Now</button>
                <button onclick="document.getElementById('post-modal').classList.add('hidden')" class="px-6 text-slate-400">Cancel</button>
            </div>
        </div>
    </div>

    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAHs-RDSsvAlw8QEllofvUsllCRqFkR_tM",
        authDomain: "aevora-2b110.firebaseapp.com",
        projectId: "aevora-2b110",
        storageBucket: "aevora-2b110.firebasestorage.app",
        messagingSenderId: "600000297954",
        appId: "1:600000297954:web:51875db0546d4f3e6557bb"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function sanitize(input) {
        let div = document.createElement('div');
        div.textContent = input;
        return div.innerHTML;
    }

    function login() { auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    function logout() { auth.signOut().then(() => location.reload()); }

    // SEARCH LOGIC
    function searchJobs() {
        const query = document.getElementById('search').value.toLowerCase();
        const cards = document.querySelectorAll('#job-feed > div');
        cards.forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(query) ? "block" : "none";
        });
    }

    // CHAT LOGIC
    async function sendMessage() {
        const input = document.getElementById('chat-input');
        if(!input.value || !auth.currentUser) return;
        await db.collection("public_chat").add({
            text: input.value, 
            user: auth.currentUser.displayName, 
            uid: auth.currentUser.uid, 
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        input.value = "";
    }

    function loadChat() {
        db.collection("public_chat").orderBy("createdAt", "asc").limitToLast(20).onSnapshot(snap => {
            const box = document.getElementById('chat-messages');
            box.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                const isMe = d.uid === auth.currentUser?.uid;
                box.innerHTML += `<div class="p-2 rounded-xl ${isMe ? 'bg-blue-600/40 self-end ml-6' : 'bg-white/5 self-start mr-6'}">
                    <span class="block text-[9px] opacity-40">${sanitize(d.user)}</span>${sanitize(d.text)}</div>`;
            });
            box.scrollTop = box.scrollHeight;
        });
    }

    // JOB FEED LOGIC
    function loadJobs() {
        db.collection("jobs").orderBy("createdAt", "desc").onSnapshot(snap => {
            const feed = document.getElementById('job-feed');
            feed.innerHTML = "";
            snap.forEach(doc => {
                const job = doc.data();
                feed.innerHTML += `
                <div class="glass p-6 rounded-[2rem] border border-white/5 job-card text-left">
                    <div class="flex justify-between mb-4">
                        <span class="text-[10px] text-blue-400 font-bold">AVAILABLE</span>
                        <span class="text-emerald-400 font-black text-lg">₹${job.price}</span>
                    </div>
                    <h3 class="font-bold text-xl mb-6">${sanitize(job.title)}</h3>
                    <button class="w-full bg-white/5 border border-white/10 p-3 rounded-xl hover:bg-blue-600 transition font-bold text-sm">Hire</button>
                </div>`;
            });
        });
    }

    async function postJob() {
        const title = sanitize(document.getElementById('job-title').value);
        const price = parseInt(document.getElementById('job-price').value);
        if(!title || !price) return;
        await db.collection("jobs").add({
            title, price, seller: auth.currentUser.displayName, sellerId: auth.currentUser.uid, createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById('post-modal').classList.add('hidden');
    }

    // AUTH OBSERVER
    auth.onAuthStateChanged(async user => {
        if (user) {
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('user-pic').src = user.photoURL;
            
            // Check for Admin Role
            db.collection("users").doc(user.uid).onSnapshot(doc => {
                if(doc.exists && (doc.data().role === 'admin' || doc.data().role === 'superadmin')) {
                    document.getElementById('admin-panel').classList.remove('hidden');
                }
                document.getElementById('balance').innerText = "₹" + (doc.data()?.balance || 0);
            });

            loadJobs();
            loadChat();
        }
    });
    </script>
</body>
</html>
