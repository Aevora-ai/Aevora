<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aevora | Professional Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore-compat.js"></script>
    <style>
        body { background: #0f172a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .card-glow:hover { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }
    </style>
</head>
<body>

    <nav class="glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">AEVORA</h1>
        <div id="user-info" class="hidden flex items-center gap-4">
            <span class="text-sm font-medium text-emerald-400">Balance: ₹10,000</span>
            <img id="user-pic" class="w-8 h-8 rounded-full border border-blue-500" src="" alt="">
            <button onclick="logout()" class="text-xs opacity-50 hover:opacity-100">Logout</button>
        </div>
        <button id="login-btn" onclick="login()" class="bg-blue-600 hover:bg-blue-500 px-5 py-2 rounded-full font-semibold transition">Connect Wallet</button>
    </nav>

    <main class="max-w-6xl mx-auto p-6">
        <header class="mb-10 flex justify-between items-end">
            <div>
                <h2 class="text-4xl font-extrabold">Service Marketplace</h2>
                <p class="text-slate-400 mt-2">Hire experts or offer your skills for ₹</p>
            </div>
            <button onclick="document.getElementById('post-modal').classList.toggle('hidden')" class="bg-emerald-600 hover:bg-emerald-500 px-6 py-3 rounded-xl font-bold transition">
                + Post New Job
            </button>
        </header>

        <div id="job-feed" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </main>

    <div id="post-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center p-4 z-50">
        <div class="glass p-8 rounded-2xl w-full max-w-md">
            <h3 class="text-xl font-bold mb-4">Post a Job</h3>
            <input id="job-title" type="text" placeholder="Job Title (e.g. Logo Design)" class="w-full bg-slate-800 p-3 rounded-lg mb-4 outline-none border border-slate-700">
            <input id="job-price" type="number" placeholder="Price (₹)" class="w-full bg-slate-800 p-3 rounded-lg mb-6 outline-none border border-slate-700">
            <div class="flex gap-3">
                <button onclick="postJob()" class="flex-1 bg-blue-600 p-3 rounded-lg font-bold">Post Now</button>
                <button onclick="document.getElementById('post-modal').classList.add('hidden')" class="flex-1 bg-slate-700 p-3 rounded-lg">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        // PASTE YOUR FIREBASE CONFIG HERE
        const firebaseConfig = {
             apiKey: "AIzaSyAHs-RDSsvAlw8QEllofvUsllCRqFkR_tM",
             authDomain: "aevora-2b110.firebaseapp.com",
             projectId: "aevora-2b110",
             storageBucket: "aevora-2b110.firebasestorage.app",
             messagingSenderId: "600000297954",
             appId: "1:600000297954:web:51875db0546d4f3e6557bb"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function login() {
            const provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider);
        }

        function logout() { auth.signOut(); location.reload(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-btn').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('user-pic').src = user.photoURL;
                loadJobs();
            }
        });

        async function postJob() {
            const title = document.getElementById('job-title').value;
            const price = document.getElementById('job-price').value;
            if(!title || !price) return alert("Fill all fields");

            await db.collection("jobs").add({
                title,
                price,
                seller: auth.currentUser.displayName,
                sellerId: auth.currentUser.uid,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            document.getElementById('post-modal').classList.add('hidden');
            document.getElementById('job-title').value = "";
            document.getElementById('job-price').value = "";
        }

        function loadJobs() {
            db.collection("jobs").orderBy("createdAt", "desc").onSnapshot(snapshot => {
                const feed = document.getElementById('job-feed');
                feed.innerHTML = "";
                snapshot.forEach(doc => {
                    const job = doc.data();
                    feed.innerHTML += `
                        <div class="glass p-6 rounded-2xl card-glow transition border border-slate-800">
                            <div class="flex justify-between items-start mb-4">
                                <span class="bg-blue-500/20 text-blue-400 text-xs px-2 py-1 rounded">Open</span>
                                <span class="text-xl font-bold text-emerald-400">₹${job.price}</span>
                            </div>
                            <h3 class="text-lg font-semibold mb-2">${job.title}</h3>
                            <p class="text-slate-400 text-sm mb-4">By ${job.seller}</p>
                            <button onclick="buyJob('${doc.id}')" class="w-full bg-slate-700 hover:bg-blue-600 p-2 rounded-lg text-sm font-medium transition">Send Proposal</button>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
